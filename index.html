<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Your Package</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #f4f4f4, #e0e0e0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 1rem 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #status {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Track Your Shipment</h1>
    <input type="text" id="trackingCode" placeholder="Enter your tracking code" />
    <button onclick="track()">Track</button>
    <p id="status"></p>
  </div>

  <script>
    const fakeDB = {
      "ABC123": "In transit",
      "XYZ789": "Delivered",
      "LMN456": "Out for delivery"
    };

    function track() {
      const code = document.getElementById('trackingCode').value.trim().toUpperCase();
      const statusText = document.getElementById('status');
      if (fakeDB[code]) {
        statusText.textContent = `Status: ${fakeDB[code]}`;
        statusText.style.color = "green";
      } else {
        statusText.textContent = "Tracking code not found.";
        statusText.style.color = "red";
      }
    }
  </script>
</body>
</html>
